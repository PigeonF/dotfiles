theme = "catppuccin_macchiato"

[editor]
cursorline = true
default-line-ending = "lf"
line-number = "relative"
trim-final-newlines = true
trim-trailing-whitespace = true
true-color = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false
git-global = false

[keys.normal]
"A-y" = ":yank-join"
