[[language]]
name = "nix"
formatter = { command = "nixfmt" }

[[language]]
name = "sshclientconfig"
# https://github.com/helix-editor/helix/issues/6896
file-types = [
  { glob = ".ssh/config" },
  { glob = "/etc/ssh/ssh_config" },
  { glob = "ssh_config.d/*.conf" },
  { glob = ".ssh/*.d/*.conf" },
]

[[language]]
name = "yaml"
# https://github.com/helix-editor/helix/issues/6896
file-types = [
  "yml",
  "yaml",
  { glob = ".prettierrc" },
  { glob = ".clangd" },
  { glob = ".clang-format" },
  { glob = ".clang-tidy" },
  { glob = ".gem/credentials" },
  { glob = ".kube/config" },
  { glob = ".kube/kuberc" },
  { glob = "yarn.lock" },
  "winget",
  "sublime-syntax",
]
